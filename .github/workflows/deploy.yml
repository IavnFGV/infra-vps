name: Deploy Infra

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate compose file
        run: docker compose config --quiet

  # Dependabot PRs of any kind (security, patch, minor, major) are merged once
  # tests pass, then deployed. A broken update fails tests and stays open.
  dependabot-automerge:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash --delete-branch "$PR_URL"
          # A merge made with GITHUB_TOKEN does not trigger push workflows,
          # so start the deploy explicitly.
          gh workflow run "${{ github.workflow }}" --ref main --repo "$GITHUB_REPOSITORY"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-infra-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      INFRA_DIR: ${{ vars.VPS_INFRA_DIR || '/workspaces/infra-vps' }}

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA,INFRA_DIR
          command_timeout: 12m
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            cd "${INFRA_DIR}"
            test "$(git branch --show-current)" = main
            if [[ ! -r "${INFRA_MASTER_KEY_FILE:-/opt/infra-secrets/master.key}" ]]; then
              echo "Registry master key is missing or unreadable; restore it before deploying."
              exit 1
            fi
            git fetch --no-tags origin "${DEPLOY_SHA}"
            # Several merges in a row dispatch several deploys; if a newer commit is
            # already deployed, this older one has nothing to do.
            if [ "$(git rev-parse HEAD)" != "${DEPLOY_SHA}" ] && git merge-base --is-ancestor "${DEPLOY_SHA}" HEAD; then
              echo "[deploy] ${DEPLOY_SHA} is older than deployed $(git rev-parse --short HEAD); skipping"
              exit 0
            fi
            # Fast-forward only: never discard server-local changes or roll back newer code.
            git merge --ff-only "${DEPLOY_SHA}"
            test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"
            ./scripts/006-deploy-infra.sh </dev/null
            ./scripts/apply-services.sh </dev/null
            docker compose ps
            echo "Deployed commit $(git rev-parse HEAD)"
            DEPLOY
